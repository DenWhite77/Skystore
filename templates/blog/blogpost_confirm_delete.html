{% extends 'base.html' %}

{% block title %}Удалить статью{% endblock %}

{% block header %}Удалить статью?{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto text-center">
        <p>Вы уверены, что хотите удалить статью <strong>«{{ blogpost.title }}»</strong>?</p>
        <p class="text-muted small">Это действие нельзя отменить.</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'blog:blogpost_detail' blogpost.pk %}" class="btn btn-outline-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
